<script>
/* ─── D1 API Persistence Layer ──────────────────────────────────────────────
   Loads data from Cloudflare Worker D1 endpoints into window.__D1
   and exposes window.D1 helpers. Does NOT modify any existing HTML/CSS/JS.
──────────────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';

  // Internal cache
  window.__D1 = {
    konsinyator: [],
    produk: [],
    transaksi: [],
    _loaded: false,
    _error: null,
  };

  // ── Fetch helpers ──────────────────────────────────────────────────────────
  async function apiFetch(path, opts) {
    const res = await fetch(path, opts);
    if (!res.ok) throw new Error('API ' + path + ' -> HTTP ' + res.status);
    return res.json();
  }

  // ── Bootstrap: load all data on DOMContentLoaded ──────────────────────────
  async function bootstrap() {
    try {
      const [konsinyator, produk, transaksi] = await Promise.all([
        apiFetch('/api/konsinyator'),
        apiFetch('/api/produk'),
        apiFetch('/api/transaksi'),
      ]);
      window.__D1.konsinyator = Array.isArray(konsinyator) ? konsinyator : [];
      window.__D1.produk      = Array.isArray(produk)      ? produk      : [];
      window.__D1.transaksi   = Array.isArray(transaksi)   ? transaksi   : [];
      window.__D1._loaded     = true;
      window.dispatchEvent(new CustomEvent('d1:loaded', { detail: window.__D1 }));
    } catch (err) {
      window.__D1._error = err;
      console.warn('[D1] bootstrap error:', err);
      window.dispatchEvent(new CustomEvent('d1:error', { detail: err }));
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }

  // ── Public helper API ──────────────────────────────────────────────────────
  window.D1 = {
    // ── Konsinyator ──────────────────────────────────────────────────────────
    getKonsinyator: function () {
      return window.__D1.konsinyator;
    },
    addKonsinyator: async function (nama, hp) {
      const result = await apiFetch('/api/konsinyator', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nama, hp }),
      });
      window.__D1.konsinyator.unshift(result);
      return result;
    },
    updateKonsinyator: async function (id, nama, hp) {
      await apiFetch('/api/konsinyator/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nama, hp }),
      });
      const k = window.__D1.konsinyator.find(function (x) { return x.id === id; });
      if (k) { k.nama = nama; k.hp = hp; }
      return { ok: true };
    },
    deleteKonsinyator: async function (id) {
      await apiFetch('/api/konsinyator/' + id, { method: 'DELETE' });
      window.__D1.konsinyator = window.__D1.konsinyator.filter(function (x) { return x.id !== id; });
      return { ok: true };
    },

    // ── Produk ───────────────────────────────────────────────────────────────
    getProduk: function (konsinyatorId) {
      if (!konsinyatorId) return window.__D1.produk;
      return window.__D1.produk.filter(function (x) { return x.konsinyator_id === konsinyatorId; });
    },
    addProduk: async function (data) {
      const result = await apiFetch('/api/produk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      window.__D1.produk.unshift(result);
      return result;
    },
    updateProduk: async function (id, data) {
      await apiFetch('/api/produk/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const p = window.__D1.produk.find(function (x) { return x.id === id; });
      if (p) Object.assign(p, data);
      return { ok: true };
    },
    deleteProduk: async function (id) {
      await apiFetch('/api/produk/' + id, { method: 'DELETE' });
      window.__D1.produk = window.__D1.produk.filter(function (x) { return x.id !== id; });
      return { ok: true };
    },

    // ── Transaksi ────────────────────────────────────────────────────────────
    getTransaksi: function (tanggal) {
      if (!tanggal) return window.__D1.transaksi;
      return window.__D1.transaksi.filter(function (x) { return x.tanggal === tanggal; });
    },
    addTransaksi: async function (data) {
      const result = await apiFetch('/api/transaksi', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      window.__D1.transaksi.unshift(result);
      return result;
    },
    updateTransaksi: async function (id, data) {
      await apiFetch('/api/transaksi/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const t = window.__D1.transaksi.find(function (x) { return x.id === id; });
      if (t) Object.assign(t, data);
      return { ok: true };
    },

    // ── Laporan ──────────────────────────────────────────────────────────────
    getLaporan: async function (tanggal) {
      return apiFetch('/api/laporan?tanggal=' + tanggal);
    },

    // ── Reload seluruh cache ─────────────────────────────────────────────────
    reload: async function () {
      window.__D1._loaded = false;
      await bootstrap();
    },
  };
})();
</script>
